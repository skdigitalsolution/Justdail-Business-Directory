  <text x="80" y="150" font-family="system-ui, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF">Reliable Home Repairs & AC Services</text>
  <text x="80" y="195" font-family="system-ui, sans-serif" font-weight="400" font-size="20" fill="#BFDBFE">Connect with top-rated electricians, plumbers, and technicians across 500+ cities in India.</text>
  
  <!-- CTA Button representation -->
