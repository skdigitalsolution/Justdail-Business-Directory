      <stop offset="0%" stop-color="#0B1830"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#city-bg)"/>
  <!-- Skyline silhouette -->
  <rect x="50" y="160" width="45" height="100" fill="#2563EB" opacity="0.5"/>
  <rect x="80" y="130" width="55" height="130" fill="#2563EB" opacity="0.8"/>
  <rect x="125" y="100" width="60" height="160" fill="#1D4ED8"/>
  <polygon points="155,75 140,100 170,100" fill="#1D4ED8"/>
  <rect x="175" y="140" width="50" height="120" fill="#2563EB" opacity="0.7"/>
  <rect x="215" y="115" width="65" height="145" fill="#3B82F6"/>
  <rect x="270" y="150" width="45" height="110" fill="#2563EB" opacity="0.6"/>
