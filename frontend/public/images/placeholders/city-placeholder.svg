  <circle cx="200" cy="100" r="120" fill="#60A5FA" opacity="0.1"/>
  <text x="200" y="280" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#93C5FD" text-anchor="middle">Metropolitan Directory Hub</text>
