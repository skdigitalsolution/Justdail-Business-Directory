<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <rect width="600" height="500" rx="30" fill="url(#hero-grad)"/>
  <circle cx="450" cy="150" r="100" fill="#2563EB" opacity="0.08"/>
  <circle cx="150" cy="380" r="120" fill="#F59E0B" opacity="0.08"/>
  
  <!-- Central Map & Location Pin -->
  <g transform="translate(180, 80)">
    <circle cx="120" cy="120" r="110" fill="#2563EB" opacity="0.1"/>
    <circle cx="120" cy="120" r="70" fill="#2563EB" opacity="0.15"/>
    <path d="M120 40c-33 0-60 27-60 60 0 45 60 100 60 100s60-55 60-100c0-33-27-60-60-60zm0 85c-14 0-25-11-25-25s11-25 25-25 25 11 25 25-11 25-25 25z" fill="#2563EB"/>
    <circle cx="120" cy="100" r="12" fill="#F59E0B"/>
  </g>
  
  <!-- Floating Mock UI Card 1: Top Rated -->
  <g transform="translate(50, 60)">
    <rect width="210" height="85" rx="16" fill="url(#card-grad)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.06))"/>
    <rect x="15" y="15" width="40" height="40" rx="10" fill="#EFF6FF"/>
    <text x="35" y="39" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#2563EB" text-anchor="middle">★</text>
    <text x="68" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0B1830">Verified Local Pros</text>
    <text x="68" y="48" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#16A34A">4.9 / 5.0 (25k+ Reviews)</text>
    <text x="15" y="73" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Instant Contact & Verification</text>
  </g>

  <!-- Floating Mock UI Card 2: Category Quick Access -->
  <g transform="translate(340, 280)">
    <rect width="220" height="95" rx="16" fill="url(#card-grad)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.06))"/>
    <rect x="15" y="15" width="45" height="45" rx="12" fill="#FEF3C7"/>
    <text x="37" y="42" font-family="system-ui, sans-serif" font-weight="700" font-size="20" fill="#D97706" text-anchor="middle">⚡</text>
    <text x="70" y="32" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#0B1830">500+ Indian Cities</text>
    <text x="70" y="48" font-family="system-ui, sans-serif" font-weight="500" font-size="11" fill="#2563EB">All-India Coverage</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Delhi, Mumbai, Bengaluru & more</text>
  </g>

  <!-- Floating Badge 3: 100% Free Listing -->
  <g transform="translate(60, 360)">
    <rect width="180" height="60" rx="14" fill="#0B1830" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.12))"/>
    <text x="90" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#F59E0B" text-anchor="middle">FREE REGISTRATION</text>
    <text x="90" y="45" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" text-anchor="middle">Add Your Business</text>
  </g>
</svg>
